    <title>Clube das Mães Unidas — Capacitando para um mundo melhor</title>

    <!-- Prévia de links (WhatsApp, Facebook, Instagram). Esses robôs não
         executam JavaScript: veem estes valores em qualquer página do site.
         As rotas trocam título/descrição em tempo real (src/lib/seo.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Clube das Mães Unidas" />
    <meta property="og:title" content="Clube das Mães Unidas — Capacitando para um mundo melhor" />

      property="og:description"
      content="ONG de Londrina/PR que capacita jovens e adultos para o mercado de trabalho por meio de cursos gratuitos e inclusão social."

    <meta property="og:url" content="https://clubedasmaesunidas.org.br/" />
    <meta property="og:image" content="https://clubedasmaesunidas.org.br/logo-cmu.png" />
    <meta property="og:image:alt" content="Logo do Clube das Mães Unidas" />
    <meta name="twitter:card" content="summary" />

    <!-- Dados estruturados: ajudam o Google a montar o painel da organização
         (endereço, telefone, redes) na busca. -->

      {
        "@context": "https://schema.org",

        "url": "https://clubedasmaesunidas.org.br/",
        "logo": "https://clubedasmaesunidas.org.br/logo-cmu.png",
        "telephone": "+55-43-3325-6488",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "R. Roseiral, 77 – Jd. Interlagos",
          "postalCode": "86035-330",
          "addressLocality": "Londrina",
          "addressRegion": "PR",
          "addressCountry": "BR"
        },
        "sameAs": [
          "https://facebook.com/clubedasmaesunidas",
          "https://instagram.com/clubedasmaesunidas"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap"
